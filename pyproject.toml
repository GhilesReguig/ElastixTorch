[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ElastixTorch"
version = "0.1.0"
description = "Elastix-style 3D image registration (multi-resolution, Mattes MI, adaptive stochastic gradient descent) in native PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["elastixtorch"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
